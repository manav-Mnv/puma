name: keepalive

# Free Supabase projects pause after 7 days without database requests (docs/02).
on:
  schedule:
    - cron: '17 3 * * *' # daily, 08:47 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query a public table
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/institutes?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded $code"
          test "$code" = "200"
