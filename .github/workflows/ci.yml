name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (typecheck, lint, test, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values (safe in the client bundle). See docs/09 Part 7.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Web build
        if: env.EXPO_PUBLIC_SUPABASE_URL != ''
        run: npm run build:web

  db:
    name: db (migrations + RLS/RPC tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: pgTAP tests (includes "every public table has RLS")
        run: supabase test db

  e2e:
    name: e2e (golden path)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase (db, auth, rest)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Point the web build at local Supabase
        run: |
          supabase status -o env > .supabase.env
          val() { grep "^$1=" .supabase.env | cut -d= -f2- | tr -d '"'; }
          echo "EXPO_PUBLIC_SUPABASE_URL=$(val API_URL)" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(val ANON_KEY)" >> "$GITHUB_ENV"
          echo "E2E_DB_URL=$(val DB_URL)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
