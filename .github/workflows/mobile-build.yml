name: mobile-build

# Builds an installable Android APK on Expo's servers (free tier, low-priority queue).
# Run it from Actions -> mobile-build -> Run workflow. The APK link appears on expo.dev
# and in this job's summary.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project (creates it on first run)
        run: eas init --non-interactive --force
      - name: Build Android
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > build.json
      - name: Write download links to the summary
        # Never fail a finished build over the summary: read fields defensively.
        if: always() && hashFiles('build.json') != ''
        run: |
          node -e "
            const fs = require('fs');
            let b = {};
            try { const j = JSON.parse(fs.readFileSync('build.json', 'utf8')); b = Array.isArray(j) ? j[0] ?? {} : j; } catch {}
            const owner = b.project?.ownerAccount?.name ?? b.accountName ?? 'mnvdev';
            const slug = b.project?.slug ?? 'edge-parul';
            const page = b.id ? 'https://expo.dev/accounts/' + owner + '/projects/' + slug + '/builds/' + b.id : 'https://expo.dev/accounts/' + owner + '/projects/' + slug + '/builds';
            const lines = ['### Android build (' + (b.status ?? 'see page') + ')', '- Build page (QR to install): ' + page];
            if (b.artifacts?.buildUrl) lines.push('- Download APK / AAB: ' + b.artifacts.buildUrl);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join('\n'));
          "
