name: mobile-build

# Builds an installable Android APK on Expo's servers (free tier, low-priority queue).
# Run it from Actions -> mobile-build -> Run workflow. The APK link appears on expo.dev
# and in this job's summary.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project (creates it on first run)
        run: eas init --non-interactive --force
      - name: Build Android
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > build.json
          url=$(node -e "const b=require('./build.json')[0]; console.log(b.artifacts?.buildUrl ?? '')")
          page=$(node -e "const b=require('./build.json')[0]; console.log('https://expo.dev/accounts/'+b.project.ownerAccount.name+'/projects/'+b.project.slug+'/builds/'+b.id)")
          echo "### Android build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK / AAB: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build page (QR to install): $page" >> "$GITHUB_STEP_SUMMARY"
